syntax = "proto3";

package inventaris;

message ProdukRequest {
  int32 id = 1;
}

message ProdukResponse {
  int32 id = 1;
  string kode = 2;
  string nama = 3;
  int32 stok = 4;
  double harga = 5;
  bool tersedia = 6;
}

service ProdukService {
  rpc GetProduk (ProdukRequest) returns (ProdukResponse);
}
